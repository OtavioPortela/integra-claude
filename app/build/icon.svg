<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10a37f"/>
      <stop offset="0.5" stop-color="#1f6f78"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- base estilo macOS (squircle com margem) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- balões: ChatGPT (esq.) e Claude (dir.) -->
  <g filter="url(#soft)">
    <rect x="200" y="250" width="270" height="200" rx="60" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M250 440 L230 510 L310 445 Z" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="554" y="574" width="270" height="200" rx="60" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M774 764 L794 834 L714 769 Z" fill="#ffffff" fill-opacity="0.95"/>
  </g>
  <!-- marcas dentro dos balões -->
  <g fill="none" stroke="#10a37f" stroke-width="22" stroke-linecap="round">
    <line x1="255" y1="320" x2="415" y2="320"/>
    <line x1="255" y1="380" x2="360" y2="380"/>
  </g>
  <g transform="translate(689 674)" fill="#d97757">
    <g id="ray"><rect x="-11" y="-62" width="22" height="62" rx="11"/></g>
    <use href="#ray" transform="rotate(45)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(225)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(315)"/>
  </g>
  <!-- setas de troca -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M560 300 C 680 300, 760 360, 760 470"/>
    <path d="M712 430 L760 482 L808 430"/>
    <path d="M464 724 C 344 724, 264 664, 264 554"/>
    <path d="M312 594 L264 542 L216 594"/>
  </g>
</svg>
