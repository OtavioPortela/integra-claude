<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 280px; margin: 12px; color: #1d1d1f; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #status { margin-bottom: 10px; }
  textarea { width: 100%; box-sizing: border-box; height: 64px; font: 11px ui-monospace, monospace; }
  button { margin-top: 6px; width: 100%; padding: 6px; }
  .muted { color: #6e6e73; font-size: 12px; }
</style>
</head>
<body>
  <h1>Integra Claude</h1>
  <div id="status">Status: …</div>
  <div class="muted">Cole o código de pareamento mostrado no app (só uma vez):</div>
  <textarea id="code" placeholder="código de pareamento"></textarea>
  <button id="pair">Parear</button>
  <div id="msg" class="muted"></div>
  <script src="popup.js"></script>
</body>
</html>
